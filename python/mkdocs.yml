site_name: bonsai-rs
site_description: Tree representations of single-cell data under Brownian motion, in Rust.
site_url: https://gregorlueg.github.io/bonsai-rs/
repo_url: https://github.com/GregorLueg/bonsai-rs
repo_name: GregorLueg/bonsai-rs
edit_uri: edit/main/python/docs/
copyright: MIT licensed

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Guide: guide.md
  - API reference:
      - Reconstruction: api/core.md
      - Trees: api/tree.md
      - Result types: api/types.md
      - Synthetic data: api/datasets.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # `bonsai_rs` sits next to mkdocs.yml, not under `docs/`.
          paths: ["."]
          options:
            docstring_style: google
            docstring_section_style: table
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 2
            filters: ["!^_"]

# `mkdocs serve` picks up a docstring edit without a restart.
watch:
  - bonsai_rs
