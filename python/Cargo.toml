[package]
name = "bonsai-rs-py"
version = "0.1.1"
edition = "2024"
authors = ["Gregor Lueg <gregorlueg@me.com>"]
license = "MIT"
description = "Python bindings for bonsai-rs"
publish = false

[workspace]

[lib]
name = "_bonsai_rs"
crate-type = ["cdylib"]

[features]
## CubeCL/wgpu Sanity, on by default: the code is small, and whether an adapter
## exists is decided at runtime by `gpu_available`.
default = ["gpu"]
gpu = ["bonsai-rs/gpu", "sanity-sc-rs/gpu", "dep:cubecl"]

[dependencies]
bonsai-rs = { path = "..", features = ["sanity"] }
cubecl = { version = "0.10.0", features = ["wgpu"], optional = true }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
sanity-sc-rs = "0.1.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.dev]
opt-level = 2
